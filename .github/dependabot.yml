version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    # Wait before proposing a fresh release (supply-chain safety).
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    # PR titles become "chore(deps): ..." / "chore(deps-dev): ...", which pass the
    # Conventional Commits title check.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    # One PR per week for all minor/patch bumps instead of one PR per package.
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
