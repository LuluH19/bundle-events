name: Setup Node and dependencies
description: Install Node (with npm cache) and run npm ci. Run actions/checkout first.

inputs:
  node-version:
    description: Node.js version
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci --no-audit --no-fund
